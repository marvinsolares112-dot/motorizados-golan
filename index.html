<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motorizados Golán</title>
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f2f5; min-height: 100vh; }
  .header { background: #d32f2f; color: white; padding: 16px; text-align: center; }
  .header h1 { font-size: 20px; }
  .header p { font-size: 12px; opacity: 0.8; }
  .container { padding: 16px; max-width: 480px; margin: 0 auto; }
  .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .card h2 { font-size: 16px; color: #d32f2f; margin-bottom: 16px; border-bottom: 2px solid #d32f2f; padding-bottom: 8px; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; margin-top: 12px; font-weight: bold; }
  input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fafafa; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #d32f2f; background: white; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 12px; }
  .btn-primary { background: #d32f2f; color: white; }
  .btn-secondary { background: #1976d2; color: white; }
  .btn-success { background: #388e3c; color: white; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .info-box { background: #fff8e1; border: 1px solid #ffc107; border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 13px; }
  .info-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .info-label { color: #777; }
  .info-value { font-weight: bold; color: #333; }
  .foto-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-top: 8px; display: none; }
  .gps-status { font-size: 12px; color: #777; margin-top: 4px; }
  .seccion-incidente { display: none; }
  .step { display: none; }
  .step.active { display: block; }
  .badge { display: inline-block; background: #d32f2f; color: white; border-radius: 20px; padding: 2px 10px; font-size: 12px; margin-bottom: 8px; }
  #mensaje-estado { text-align: center; padding: 12px; border-radius: 8px; margin-top: 12px; display: none; font-weight: bold; }
  .exito { background: #e8f5e9; color: #388e3c; }
  .error { background: #ffebee; color: #d32f2f; }
</style>
</head>
<body>

<div class="header">
  <h1>🏍️ Motorizados Golán</h1>
  <p>Sistema de registro de apoyo</p>
</div>

<div class="container">

  <!-- PASO 1: Inicio de día -->
  <div class="step active" id="paso1">
    <div class="card">
      <div class="badge">Paso 1 de 3</div>
      <h2>Inicio de día</h2>
      <label>Nombre completo</label>
      <input type="text" id="nombreMotorizado" placeholder="Tu nombre completo">
      <label>Placa de tu motocicleta</label>
      <input type="text" id="placaMoto" placeholder="Ej: M751LSR" style="text-transform:uppercase">
      <button class="btn btn-primary" onclick="irPaso2()">Continuar →</button>
    </div>
  </div>

  <!-- PASO 2: Registro de apoyo -->
  <div class="step" id="paso2">
    <div class="card">
      <div class="badge">Paso 2 de 3</div>
      <h2>Registrar apoyo</h2>
      <p style="font-size:13px;color:#777;">Bienvenido, <strong id="nombreDisplay"></strong></p>

      <label>Placa de la unidad que apoyás</label>
      <input type="text" id="placaUnidad" placeholder="Ej: C-251BZV" style="text-transform:uppercase" oninput="buscarUnidad()">

      <div class="info-box" id="infoUnidad" style="display:none">
        <div class="info-row"><span class="info-label">Ruta:</span><span class="info-value" id="infoRuta"></span></div>
        <div class="info-row"><span class="info-label">Operación:</span><span class="info-value" id="infoOperacion"></span></div>
        <div class="info-row"><span class="info-label">Unidad operativa:</span><span class="info-value" id="infoUnidadOp"></span></div>
        <div class="info-row"><span class="info-label">Tipo de ruta:</span><span class="info-value" id="infoTipoRuta"></span></div>
      </div>

      <label>📍 Ubicación GPS</label>
      <button class="btn btn-secondary" onclick="capturarGPS()">Capturar ubicación</button>
      <p class="gps-status" id="gpsStatus">Sin ubicación capturada</p>

      <label>📷 Fotografía</label>
      <input type="file" id="fotoInput" accept="image/*" capture="environment" onchange="previsualizarFoto()">
      <img id="fotoPreview" class="foto-preview">

      <label>¿Realizó rondas?</label>
      <select id="rondasRealizadas" onchange="toggleMotivo()">
        <option value="Sí">Sí</option>
        <option value="No">No</option>
      </select>

      <div id="motivoDiv" style="display:none">
        <label>Motivo de no realizar ronda</label>
        <select id="motivoNoRonda">
          <option value="">Seleccioná un motivo</option>
          <option>Falla mecánica</option>
          <option>Accidente vial</option>
          <option>Emergencia médica</option>
          <option>Emergencia personal</option>
          <option>Abandono de puesto</option>
          <option>Abastecimiento de combustible</option>
          <option>Mantenimiento correctivo</option>
          <option>Mantenimiento preventivo</option>
          <option>Cobertura especial</option>
        </select>
      </div>

      <label>¿Hubo incidente?</label>
      <select id="incidenteReportado" onchange="toggleIncidente()">
        <option value="No">No</option>
        <option value="Sí">Sí</option>
      </select>

      <div class="seccion-incidente" id="seccionIncidente">
        <label>Tipo de incidencia</label>
        <select id="tipoIncidencia">
          <option value="">Seleccioná</option>
          <option>Robo</option>
          <option>Hurto</option>
          <option>Persona sospechosa</option>
          <option>Vehículo sospechoso</option>
          <option>Accidente vial</option>
          <option>Ataque armado</option>
          <option>Resguardo de unidad</option>
          <option>Unidad retenida</option>
        </select>
        <label>Acción efectuada</label>
        <select id="accionEfectuada">
          <option value="">Seleccioná</option>
          <option>Accionó arma</option>
          <option>Repelió ataque</option>
          <option>Disuación efectiva</option>
          <option>N/A</option>
        </select>
        <label>Cantidad de heridos</label>
        <input type="number" id="cantidadHeridos" value="0" min="0">
        <label>Cantidad de fallecidos</label>
        <input type="number" id="cantidadFallecidos" value="0" min="0">
        <label>Descripción del incidente</label>
        <textarea id="descripcionIncidente" rows="3" placeholder="Describí lo que ocurrió..."></textarea>
        <label>Hora inicio incidencia</label>
        <input type="time" id="horaInicioIncidencia">
        <label>Hora fin incidencia</label>
        <input type="time" id="horaFinIncidencia">
      </div>

      <label>Observaciones (opcional)</label>
      <textarea id="observaciones" rows="2" placeholder="Alguna observación adicional..."></textarea>

      <button class="btn btn-success" onclick="irPaso3()">Finalizar registro →</button>
      <button class="btn" style="background:#777;color:white;margin-top:8px" onclick="irPaso1()">← Volver</button>
    </div>
  </div>

  <!-- PASO 3: Confirmación -->
  <div class="step" id="paso3">
    <div class="card">
      <div class="badge">Paso 3 de 3</div>
      <h2>Confirmar y enviar</h2>
      <div class="info-box" id="resumenFinal"></div>
      <button class="btn btn-success" id="btnEnviar" onclick="enviarRegistro()">✅ Enviar registro</button>
      <button class="btn" style="background:#777;color:white;margin-top:8px" onclick="irPaso2()">← Corregir</button>
      <div id="mensaje-estado"></div>
    </div>
  </div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYCl3ZYGpRWbDNST6Di7lCBrHWpoCLjhTzjzYuCEzCeJVbxN94KTtu_duPXont5tWSfA/exec";

let gpsLat = "", gpsLng = "", fotoBase64 = "", horaInicio = "";

const MAESTRO = {};

async function cargarMaestro() {
  try {
    const res = await fetch(`${SCRIPT_URL}?action=maestro`);
    const data = await res.json();
    data.forEach(u => { MAESTRO[u.placa.trim().toUpperCase()] = u; });
  } catch(e) {}
}

function irPaso1() {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('paso1').classList.add('active');
}

function irPaso2() {
  const nombre = document.getElementById('nombreMotorizado').value.trim();
  const placaMoto = document.getElementById('placaMoto').value.trim();
  if (!nombre || !placaMoto) { alert('Por favor completá tu nombre y placa de moto.'); return; }
  document.getElementById('nombreDisplay').textContent = nombre;
  horaInicio = new Date().toTimeString().slice(0,5);
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('paso2').classList.add('active');
}

function irPaso3() {
  const placa = document.getElementById('placaUnidad').value.trim().toUpperCase();
  if (!placa) { alert('Por favor ingresá la placa de la unidad.'); return; }
  if (!gpsLat) { alert('Por favor capturá la ubicación GPS.'); return; }
  
  const horaFin = new Date().toTimeString().slice(0,5);
  const unidad = MAESTRO[placa] || {};
  
  document.getElementById('resumenFinal').innerHTML = `
    <div class="info-row"><span class="info-label">Motorizado:</span><span class="info-value">${document.getElementById('nombreMotorizado').value}</span></div>
    <div class="info-row"><span class="info-label">Placa unidad:</span><span class="info-value">${placa}</span></div>
    <div class="info-row"><span class="info-label">Operación:</span><span class="info-value">${unidad.operacion || 'No encontrada'}</span></div>
    <div class="info-row"><span class="info-label">Unidad operativa:</span><span class="info-value">${unidad.unidadOperativa || '-'}</span></div>
    <div class="info-row"><span class="info-label">Hora inicio:</span><span class="info-value">${horaInicio}</span></div>
    <div class="info-row"><span class="info-label">Hora fin:</span><span class="info-value">${horaFin}</span></div>
    <div class="info-row"><span class="info-label">GPS:</span><span class="info-value">${gpsLat}, ${gpsLng}</span></div>
    <div class="info-row"><span class="info-label">Foto:</span><span class="info-value">${fotoBase64 ? '✅ Capturada' : '❌ Sin foto'}</span></div>
    <div class="info-row"><span class="info-label">Rondas:</span><span class="info-value">${document.getElementById('rondasRealizadas').value}</span></div>
    <div class="info-row"><span class="info-label">Incidente:</span><span class="info-value">${document.getElementById('incidenteReportado').value}</span></div>
  `;
  
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('paso3').classList.add('active');
}

function buscarUnidad() {
  const placa = document.getElementById('placaUnidad').value.trim().toUpperCase();
  const unidad = MAESTRO[placa];
  if (unidad) {
    document.getElementById('infoRuta').textContent = unidad.rutaAsignada || '-';
    document.getElementById('infoOperacion').textContent = unidad.operacion || '-';
    document.getElementById('infoUnidadOp').textContent = unidad.unidadOperativa || '-';
    document.getElementById('infoTipoRuta').textContent = unidad.tipoRuta || '-';
    document.getElementById('infoUnidad').style.display = 'block';
  } else {
    document.getElementById('infoUnidad').style.display = 'none';
  }
}

function capturarGPS() {
  const btn = event.target;
  btn.textContent = 'Capturando...';
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(
    pos => {
      gpsLat = pos.coords.latitude.toFixed(6);
      gpsLng = pos.coords.longitude.toFixed(6);
      document.getElementById('gpsStatus').textContent = `✅ ${gpsLat}, ${gpsLng}`;
      document.getElementById('gpsStatus').style.color = '#388e3c';
      btn.textContent = '✅ Ubicación capturada';
      btn.disabled = false;
    },
    err => {
      document.getElementById('gpsStatus').textContent = '❌ No se pudo obtener ubicación';
      document.getElementById('gpsStatus').style.color = '#d32f2f';
      btn.textContent = 'Reintentar';
      btn.disabled = false;
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function previsualizarFoto() {
  const file = document.getElementById('fotoInput').files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 800;
      let w = img.width, h = img.height;
      if (w > MAX) { h = h * MAX / w; w = MAX; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      fotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
      document.getElementById('fotoPreview').src = fotoBase64;
      document.getElementById('fotoPreview').style.display = 'block';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function toggleMotivo() {
  const val = document.getElementById('rondasRealizadas').value;
  document.getElementById('motivoDiv').style.display = val === 'No' ? 'block' : 'none';
}

function toggleIncidente() {
  const val = document.getElementById('incidenteReportado').value;
  document.getElementById('seccionIncidente').style.display = val === 'Sí' ? 'block' : 'none';
}

async function enviarRegistro() {
  const btn = document.getElementById('btnEnviar');
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  
  const placa = document.getElementById('placaUnidad').value.trim().toUpperCase();
  const horaFin = new Date().toTimeString().slice(0,5);
  
  const datos = {
    nombreMotorizado: document.getElementById('nombreMotorizado').value,
    placaMoto: document.getElementById('placaMoto').value.toUpperCase(),
    placa: placa,
    horaInicio: horaInicio,
    horaFin: horaFin,
    latitud: gpsLat,
    longitud: gpsLng,
    foto: fotoBase64,
    rondasRealizadas: document.getElementById('rondasRealizadas').value,
    motivoNoRonda: document.getElementById('motivoNoRonda')?.value || '',
    incidenteReportado: document.getElementById('incidenteReportado').value,
    tipoIncidencia: document.getElementById('tipoIncidencia')?.value || '',
    accionEfectuada: document.getElementById('accionEfectuada')?.value || '',
    cantidadHeridos: document.getElementById('cantidadHeridos')?.value || '0',
    cantidadFallecidos: document.getElementById('cantidadFallecidos')?.value || '0',
    descripcionIncidente: document.getElementById('descripcionIncidente')?.value || '',
    horaInicioIncidencia: document.getElementById('horaInicioIncidencia')?.value || '',
    horaFinIncidencia: document.getElementById('horaFinIncidencia')?.value || '',
    observaciones: document.getElementById('observaciones').value
  };

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(datos)
    });
    const msg = document.getElementById('mensaje-estado');
    msg.textContent = '✅ ¡Registro enviado correctamente!';
    msg.className = 'exito';
    msg.style.display = 'block';
    setTimeout(() => {
      gpsLat = ''; gpsLng = ''; fotoBase64 = '';
      document.getElementById('placaUnidad').value = '';
      document.getElementById('fotoPreview').style.display = 'none';
      document.getElementById('infoUnidad').style.display = 'none';
      document.getElementById('gpsStatus').textContent = 'Sin ubicación capturada';
      irPaso2();
    }, 3000);
  } catch(e) {
    const msg = document.getElementById('mensaje-estado');
    msg.textContent = '❌ Error al enviar. Intentá de nuevo.';
    msg.className = 'error';
    msg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '✅ Enviar registro';
  }
}

cargarMaestro();
</script>
</body>
</html>
